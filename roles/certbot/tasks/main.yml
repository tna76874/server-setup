---
- name: Remove apt-based certbot (conflicts with snap version)
  ansible.builtin.apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: absent
    purge: true
  become: true

- name: Install certbot via snap
  become: true
  block:
    - name: Install snapd
      ansible.builtin.apt:
        name: snapd
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install certbot snap
      community.general.snap:
        name: certbot
        classic: true

    - name: Create symlink for certbot command
      ansible.builtin.file:
        src: /snap/bin/certbot
        dest: "{{ certbot_path }}"
        state: link
